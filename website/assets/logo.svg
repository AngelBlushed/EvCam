<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a9e"/>
      <stop offset="0.52" stop-color="#171244"/>
      <stop offset="1" stop-color="#090920"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#c3b8ff"/>
      <stop offset="0.5" stop-color="#58d3ff"/>
      <stop offset="1" stop-color="#3df2c4"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#05061a"/>
      <stop offset="0.42" stop-color="#101b66"/>
      <stop offset="0.78" stop-color="#3b39da"/>
      <stop offset="1" stop-color="#63d7ff"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="118"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="256" cy="268" r="190" fill="#6a56ff" opacity="0.32" filter="url(#soft)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- lens -->
  <circle cx="256" cy="268" r="158" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="256" cy="268" r="128" fill="#0a0b25"/>
  <circle cx="256" cy="268" r="113" fill="url(#iris)"/>
  <circle cx="256" cy="268" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  <circle cx="256" cy="268" r="45" fill="#03040d"/>
  <path d="M176 222 A92 92 0 0 1 244 178" fill="none" stroke="#ffffff" stroke-opacity="0.88" stroke-width="17" stroke-linecap="round"/>
  <circle cx="306" cy="318" r="11" fill="#ffffff" fill-opacity="0.55"/>

  <!-- live dot -->
  <circle cx="400" cy="116" r="30" fill="#ff4d8d" opacity="0.55" filter="url(#glow)"/>
  <circle cx="400" cy="116" r="23" fill="#ff4d8d"/>
  <circle cx="392" cy="108" r="7" fill="#ffffff" fill-opacity="0.65"/>
</svg>
